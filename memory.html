<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soda Memory Game 🥤</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: bounceIn 0.8s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 3.5em;
            color: white;
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.3), 
                         8px 8px 0px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            border: 3px solid #4facfe;
        }

        .stat span {
            color: #ff1493;
            font-size: 1.4em;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .card {
            aspect-ratio: 1;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            pointer-events: none;
            animation: matchPop 0.5s ease-out;
        }

        @keyframes matchPop {
            0% { transform: scale(1) rotateY(180deg); }
            50% { transform: scale(1.15) rotateY(180deg); }
            100% { transform: scale(1) rotateY(180deg); }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(0, 0, 0, 0.1);
        }

        .card-back {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            font-size: 3em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            transform: rotateY(0deg);
        }

        .card-front {
            transform: rotateY(180deg);
            background: white;
            font-size: 3em;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: 3px solid white;
        }

        .btn-primary:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.5);
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: 3px solid white;
        }

        .btn-secondary:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 30px rgba(245, 87, 108, 0.5);
        }

        .btn-secondary:active {
            transform: scale(0.95);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 500px;
            width: 90%;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .modal h2 {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
        }

        .modal p {
            font-size: 1.5em;
            color: #764ba2;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 1001;
        }

        @media (max-width: 600px) {
            .game-board {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }

            h1 {
                font-size: 2.5em;
            }

            .stat {
                font-size: 1em;
                padding: 10px 15px;
            }

            .card-back, .card-front {
                font-size: 2em;
            }
        }

        @media (max-width: 400px) {
            .game-board {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }

            h1 {
                font-size: 2em;
            }

            button {
                padding: 12px 25px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥤 Soda Memory 🥤</h1>
            <div class="stats">
                <div class="stat">Moves: <span id="moves">0</span></div>
                <div class="stat">Matched: <span id="matched">0</span>/10</div>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="button-group">
            <button class="btn-primary" onclick="resetGame()">🔄 New Game</button>
            <button class="btn-secondary" onclick="hintMode()">💡 Hint</button>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2>🎉 You Won! 🎉</h2>
            <p id="finalStats"></p>
            <button class="btn-primary" onclick="resetGame(); closeModal()">Play Again</button>
        </div>
    </div>

    <script>
        // Create audio context for sound generation
        let audioContext = null;

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            // Resume context if suspended (required by modern browsers)
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            return audioContext;
        }

        function playHurraySound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const duration = 0.6;

                // Create three ascending "whoop" tones
                const frequencies = [392, 523, 659]; // G4, C5, E5 - cheerful ascending notes
                
                frequencies.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gainNode = ctx.createGain();
                    
                    osc.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    
                    // Stagger the notes slightly
                    const noteStart = now + (index * 0.15);
                    const noteEnd = noteStart + 0.25;
                    
                    gainNode.gain.setValueAtTime(0, noteStart);
                    gainNode.gain.linearRampToValueAtTime(0.3, noteStart + 0.05);
                    gainNode.gain.linearRampToValueAtTime(0, noteEnd);
                    
                    osc.start(noteStart);
                    osc.stop(noteEnd);
                });

                // Add a celebratory "whoosh" with noise
                const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) {
                    noiseData[i] = Math.random() * 2 - 1;
                }

                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                const noiseGainNode = ctx.createGain();
                const filter = ctx.createBiquadFilter();

                noiseSource.connect(filter);
                filter.connect(noiseGainNode);
                noiseGainNode.connect(ctx.destination);

                filter.type = 'highpass';
                filter.frequency.value = 2000;

                noiseGainNode.gain.setValueAtTime(0.1, now);
                noiseGainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                noiseSource.start(now);
                noiseSource.stop(now + 0.3);
            } catch (error) {
                console.log('Audio playback not available:', error);
            }
        }

        // Soda data with consistent styling
        const sodas = [
            { name: 'Cherry Cola', color: '#dc143c', icon: '🍒' },
            { name: 'Orange Soda', color: '#ff8c00', icon: '🍊' },
            { name: 'Lime Fizz', color: '#32cd32', icon: '🍋' },
            { name: 'Grape Pop', color: '#9370db', icon: '🍇' },
            { name: 'Lemon Blast', color: '#ffff00', icon: '⭐' },
            { name: 'Blue Splash', color: '#4169e1', icon: '💙' },
            { name: 'Strawberry Fizz', color: '#ff69b4', icon: '🍓' },
            { name: 'Apple Crunch', color: '#228b22', icon: '🍎' },
            { name: 'Banana Burst', color: '#ffd700', icon: '🍌' },
            { name: 'Rainbow Pop', color: '#ff1493', icon: '🌈' }
        ];

        let gameCards = [];
        let flipped = [];
        let matched = [];
        let moves = 0;
        let gameActive = true;

        function createSodaCard(soda) {
            return `
                <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
                    <!-- Bottle cap -->
                    <circle cx="100" cy="30" r="25" fill="#ff6b00" stroke="#cc5500" stroke-width="2"/>
                    <rect x="85" y="28" width="30" height="8" fill="#ffaa33"/>
                    
                    <!-- Bottle neck -->
                    <path d="M 90 55 L 95 50 L 105 50 L 110 55 Z" fill="${soda.color}" stroke="#000" stroke-width="1"/>
                    
                    <!-- Main bottle -->
                    <path d="M 70 55 Q 60 80 65 140 Q 65 180 100 200 Q 135 180 135 140 Q 140 80 130 55 Z" 
                          fill="${soda.color}" stroke="#000" stroke-width="2"/>
                    
                    <!-- Bottle shine -->
                    <ellipse cx="80" cy="100" rx="12" ry="35" fill="white" opacity="0.4"/>
                    
                    <!-- Liquid level -->
                    <path d="M 70 120 Q 60 125 65 140 Q 65 180 100 200 Q 135 180 135 140 Q 140 125 130 120 Z" 
                          fill="${soda.color}" opacity="0.7" stroke="none"/>
                    
                    <!-- Bubbles -->
                    <circle cx="85" cy="110" r="4" fill="white" opacity="0.6"/>
                    <circle cx="110" cy="125" r="3" fill="white" opacity="0.5"/>
                    <circle cx="95" cy="145" r="3.5" fill="white" opacity="0.5"/>
                    
                    <!-- Label area -->
                    <rect x="75" y="85" width="50" height="45" fill="white" rx="3" opacity="0.9"/>
                    <text x="100" y="105" font-size="24" text-anchor="middle" dominant-baseline="middle">${soda.icon}</text>
                    <text x="100" y="122" font-size="10" text-anchor="middle" font-weight="bold" fill="${soda.color}">${soda.name}</text>
                </svg>
            `;
        }

        function initGame() {
            gameCards = [];
            flipped = [];
            matched = [];
            moves = 0;
            gameActive = true;

            // Create pairs
            const pairs = [];
            sodas.forEach((soda, index) => {
                pairs.push({ ...soda, id: index });
                pairs.push({ ...soda, id: index });
            });

            // Shuffle
            gameCards = pairs.sort(() => Math.random() - 0.5);

            // Render board
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';

            gameCards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `
                    <div class="card-face card-back">
                        <span style="font-size: 2.5em;">🥤</span>
                    </div>
                    <div class="card-face card-front">
                        ${createSodaCard(card)}
                    </div>
                `;
                cardEl.addEventListener('click', () => flipCard(index));
                board.appendChild(cardEl);
            });

            updateStats();
        }

        function flipCard(index) {
            if (!gameActive || flipped.includes(index) || matched.includes(index)) return;

            const cardEl = document.querySelectorAll('.card')[index];
            cardEl.classList.add('flipped');
            flipped.push(index);

            if (flipped.length === 2) {
                gameActive = false;
                moves++;
                updateStats();

                setTimeout(() => {
                    checkMatch();
                }, 600);
            }
        }

        function checkMatch() {
            const [first, second] = flipped;
            const match = gameCards[first].id === gameCards[second].id;

            if (match) {
                matched.push(first, second);
                document.querySelectorAll('.card')[first].classList.add('matched');
                document.querySelectorAll('.card')[second].classList.add('matched');
                playHurraySound();
                createConfetti();

                if (matched.length === 20) {
                    setTimeout(showWinModal, 500);
                }
            } else {
                document.querySelectorAll('.card')[first].classList.remove('flipped');
                document.querySelectorAll('.card')[second].classList.remove('flipped');
            }

            flipped = [];
            gameActive = true;
            updateStats();
        }

        function updateStats() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('matched').textContent = matched.length / 2;
        }

        function resetGame() {
            initGame();
            closeModal();
        }

        function showWinModal() {
            document.getElementById('finalStats').textContent = `You completed it in ${moves} moves!`;
            document.getElementById('winModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('winModal').classList.remove('show');
        }

        function hintMode() {
            if (!gameActive || matched.length === 20) return;

            gameActive = false;
            
            // Show all cards briefly
            document.querySelectorAll('.card').forEach(card => {
                if (!card.classList.contains('matched')) {
                    card.classList.add('flipped');
                }
            });

            setTimeout(() => {
                document.querySelectorAll('.card').forEach(card => {
                    if (!card.classList.contains('matched') && !card.classList.contains('hint-used')) {
                        card.classList.remove('flipped');
                    }
                });
                gameActive = true;
            }, 2000);
        }

        function createConfetti() {
            const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe', '#ff1493'];
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.innerHTML = '🎉';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-20px';
                confetti.style.fontSize = Math.random() * 20 + 15 + 'px';
                confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(confetti);

                let top = -20;
                const interval = setInterval(() => {
                    top += Math.random() * 5 + 3;
                    confetti.style.top = top + 'px';
                    confetti.style.opacity = 1 - (top / window.innerHeight);
                    if (top > window.innerHeight) {
                        clearInterval(interval);
                        confetti.remove();
                    }
                }, 30);
            }
        }

        // Start game
        initGame();
    </script>
</body>
</html>
