<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fun stuff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --pink: #ff2bd6; --cyan: #21f0ff; --yellow: #ffe62b; --bg: #0b0224;
    --card-w: min(60vw, 280px);
    --card-h: calc(var(--card-w) * 1.35);
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    display: flex; flex-direction: column; align-items: center;
    user-select: none; -webkit-user-select: none;
  }
  /* neon perspective grid floor */
  body::before {
    content: ""; position: fixed; left: -50%; right: -50%; bottom: 0; height: 55%;
    background:
      linear-gradient(var(--pink) 2px, transparent 2px) 0 0 / 100% 48px,
      linear-gradient(90deg, var(--pink) 2px, transparent 2px) 0 0 / 60px 100%;
    opacity: .35;
    transform: perspective(300px) rotateX(60deg);
    transform-origin: bottom;
    animation: grid 1.2s linear infinite;
    mask-image: linear-gradient(to top, #000 30%, transparent);
    -webkit-mask-image: linear-gradient(to top, #000 30%, transparent);
    z-index: 0;
  }
  @keyframes grid { to { background-position: 0 48px, 0 0; } }
  /* starfield */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(2px 2px at 20% 15%, #fff, transparent),
      radial-gradient(2px 2px at 70% 25%, var(--cyan), transparent),
      radial-gradient(1px 1px at 40% 60%, #fff, transparent),
      radial-gradient(2px 2px at 85% 70%, var(--yellow), transparent),
      radial-gradient(1px 1px at 10% 80%, #fff, transparent),
      radial-gradient(2px 2px at 55% 8%, #fff, transparent);
    animation: twinkle 3s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .4; } to { opacity: 1; } }

  header { position: relative; z-index: 2; text-align: center; padding: 22px 12px 0; }
  h1 {
    font-size: clamp(20px, 6vw, 40px); line-height: 1.3; color: var(--yellow);
    text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 #5b0a7a, 0 0 24px var(--pink);
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .insert {
    margin-top: 14px; font-size: 10px; color: var(--cyan);
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .stage {
    position: relative; z-index: 1; flex: 1; width: 100%; min-height: 0;
    perspective: 1100px; display: flex; align-items: center; justify-content: center;
    touch-action: pan-y;
  }
  .ring {
    position: relative; width: var(--card-w); height: var(--card-h);
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.2, .9, .3, 1.2);
  }
  .card {
    position: absolute; inset: 0; display: block; text-decoration: none; color: #fff;
    background: #14063a; border: 4px solid var(--cyan); border-radius: 14px;
    box-shadow: 0 0 0 4px #14063a, 0 0 26px var(--cyan);
    overflow: hidden; backface-visibility: hidden; cursor: pointer;
    transition: border-color .3s, box-shadow .3s, filter .3s;
    filter: brightness(.55) saturate(.8);
  }
  .card.active {
    filter: none; border-color: var(--yellow);
    box-shadow: 0 0 0 4px #14063a, 0 0 40px var(--yellow), 0 0 80px var(--pink);
  }
  .card img {
    width: 100%; height: 72%; object-fit: cover; object-position: top; display: block;
    border-bottom: 4px solid var(--pink); background: #000; pointer-events: none;
  }
  .card .info { padding: 10px 10px 0; text-align: center; }
  .card .name { font-size: clamp(9px, 2.6vw, 12px); line-height: 1.5; color: var(--yellow); }
  .card .play {
    display: none; margin-top: 8px; font-size: 10px; color: var(--cyan);
    animation: blink .8s steps(2) infinite;
  }
  .card.active .play { display: block; }
  /* reflection-less shine */
  .card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%);
  }

  .controls {
    position: relative; z-index: 2; display: flex; gap: 18px; align-items: center;
    padding: 6px 0 calc(22px + env(safe-area-inset-bottom));
  }
  .btn {
    font-family: inherit; font-size: 20px; width: 64px; height: 64px; border-radius: 50%;
    border: 4px solid #fff; color: #fff; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ff7ae9, var(--pink) 60%, #a10084);
    box-shadow: 0 6px 0 #5b0a7a, 0 0 20px var(--pink);
    transition: transform .08s, box-shadow .08s;
  }
  .btn.r { background: radial-gradient(circle at 35% 30%, #8ffaff, var(--cyan) 60%, #0093a1); box-shadow: 0 6px 0 #04566e, 0 0 20px var(--cyan); }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #5b0a7a, 0 0 20px var(--pink); }
  .btn.r:active { box-shadow: 0 1px 0 #04566e, 0 0 20px var(--cyan); }
  .dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; background: #3a2a6b; border: 2px solid #fff; transition: background .2s; }
  .dot.on { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }

  @media (prefers-reduced-motion: reduce) {
    body::before, body::after, h1, .insert, .card .play { animation: none; }
    .ring { transition-duration: .01s; }
  }
</style>
</head>
<body>
  <header>
    <h1>FUN<br>STUFF</h1>
    <div class="insert">&#9733; PICK YOUR EXPERIENCE &#9733;</div>
  </header>

  <main class="stage" id="stage" aria-label="Game carousel">
    <div class="ring" id="ring"></div>
  </main>

  <div class="controls">
    <button class="btn" id="prev" aria-label="Previous game">&#9664;</button>
    <div class="dots" id="dots"></div>
    <button class="btn r" id="next" aria-label="Next game">&#9654;</button>
  </div>

<script>
  // Relative paths (no leading slash) so this works on GitHub Pages project sites (user.github.io/repo/).
  const GAMES = [
    { name: 'Future Architect', href: 'builder.html',     img: 'thumbs/builder.jpg' },
    { name: 'Egg Hunt',         href: 'eggs.html',        img: 'thumbs/eggs.jpg' },
    { name: 'Soda Memory',      href: 'memory.html',      img: 'thumbs/memory.jpg' },
    { name: 'Reward Chart',     href: 'rewardsList.html', img: 'thumbs/rewardsList.jpg' },
  ];

  const ring = document.getElementById('ring');
  const dotsEl = document.getElementById('dots');
  const n = GAMES.length;
  const step = 360 / n;
  let index = 0;   // unbounded so rotation always takes the short way round
  let radius = 0;

  const cards = GAMES.map((g, i) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.href;
    a.innerHTML = `<img src="${g.img}" alt="${g.name} screenshot" draggable="false">
      <div class="info"><div class="name">${g.name}</div><div class="play">&#9654; PRESS START</div></div>`;
    a.addEventListener('click', e => {
      if (mod(index) !== i) { e.preventDefault(); goTo(i); }
    });
    ring.appendChild(a);
    const d = document.createElement('div');
    d.className = 'dot';
    dotsEl.appendChild(d);
    return a;
  });
  const dots = [...dotsEl.children];

  function mod(x) { return ((x % n) + n) % n; }

  function layout() {
    const w = cards[0].offsetWidth;
    radius = Math.round((w / 2) / Math.tan(Math.PI / n)) + 30;
    cards.forEach((c, i) => { c.style.transform = `rotateY(${i * step}deg) translateZ(${radius}px)`; });
    render();
  }

  function render() {
    ring.style.transform = `translateZ(${-radius}px) rotateY(${-index * step}deg)`;
    cards.forEach((c, i) => c.classList.toggle('active', i === mod(index)));
    dots.forEach((d, i) => d.classList.toggle('on', i === mod(index)));
  }

  function goTo(i) {
    let diff = mod(i - index);
    if (diff > n / 2) diff -= n;
    index += diff;
    render();
  }
  const move = d => { index += d; render(); };

  document.getElementById('prev').onclick = () => move(-1);
  document.getElementById('next').onclick = () => move(1);
  dots.forEach((d, i) => d.onclick = () => goTo(i));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') move(-1);
    else if (e.key === 'ArrowRight') move(1);
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.href = GAMES[mod(index)].href; }
  });

  // swipe
  let sx = null, swiped = false;
  const stage = document.getElementById('stage');
  stage.addEventListener('pointerdown', e => { sx = e.clientX; });
  stage.addEventListener('pointerup', e => {
    if (sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 40) {
      move(dx < 0 ? 1 : -1);
      swiped = true; setTimeout(() => swiped = false, 300);
    }
  });
  stage.addEventListener('pointercancel', () => { sx = null; });
  // a swipe that started on a card shouldn't also navigate
  stage.addEventListener('click', e => { if (swiped) e.preventDefault(); }, true);

  addEventListener('resize', layout);
  layout();
</script>
</body>
</html>
